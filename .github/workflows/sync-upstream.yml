name: Sync upstream pstack
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate content from cursor/plugins (sync + check + audit)
        run: bash scripts/sync.sh
      - name: Stop if nothing changed
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- content lib public UPSTREAM_SHA)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "pstack-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content lib public UPSTREAM_SHA
          git commit -m "sync: cursor/plugins@$(cut -c1-7 UPSTREAM_SHA) pstack"
          git push origin HEAD:main
