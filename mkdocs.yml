site_name: 'pstack: Complete Reader'
site_url: https://pstack-docs-nishil-faldus-projects.vercel.app/
repo_url: https://github.com/cursor/plugins
repo_name: cursor/plugins
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: black
    accent: deep purple
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: black
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  features:
  - navigation.instant
  - navigation.sections
  - navigation.footer
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
markdown_extensions:
- tables
- sane_lists
- attr_list
- md_in_html
- admonition
- pymdownx.details: {}
- pymdownx.superfences: {}
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde: {}
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight: {}
- pymdownx.inlinehilite: {}
plugins:
- search
extra_css:
- stylesheets/extra.css
- stylesheets/read-aloud.css
extra_javascript:
- javascripts/read-aloud.js
